basePath: /
definitions:
  schemas.CatalogSchema:
    properties:
      courses:
        items:
          $ref: '#/definitions/schemas.CourseSummarySchema'
        type: array
      domains:
        description: Domains are those with at least one course in the catalog, in
          display order.
        items:
          $ref: '#/definitions/schemas.DomainSchema'
        type: array
    type: object
  schemas.CourseSchema:
    properties:
      breakIts:
        description: BreakIts are the failure modes the learner triggers in the simulations.
        example:
        - Lost write
        - Stale read
        - Split brain
        items:
          type: string
        type: array
      description:
        example: Quorums, elections and leases, and the trade-offs behind each one.
        type: string
      domain:
        example: dist
        type: string
      id:
        example: replication-consensus
        type: string
      isFree:
        example: false
        type: boolean
      isNew:
        example: false
        type: boolean
      lessonCount:
        example: 12
        type: integer
      level:
        enum:
        - foundational
        - intermediate
        - advanced
        example: advanced
        type: string
      minutes:
        description: |-
          Minutes is the course's advertised length, which is more than the sum of
          its lessons: it includes time spent in the simulations.
        example: 198
        type: integer
      modules:
        items:
          $ref: '#/definitions/schemas.ModuleSchema'
        type: array
      title:
        example: Replication & consensus
        type: string
    type: object
  schemas.CourseSummarySchema:
    properties:
      breakIts:
        description: BreakIts are the failure modes the learner triggers in the simulations.
        example:
        - Lost write
        - Stale read
        - Split brain
        items:
          type: string
        type: array
      description:
        example: Quorums, elections and leases, and the trade-offs behind each one.
        type: string
      domain:
        example: dist
        type: string
      id:
        example: replication-consensus
        type: string
      isFree:
        example: false
        type: boolean
      isNew:
        example: false
        type: boolean
      lessonCount:
        example: 12
        type: integer
      level:
        enum:
        - foundational
        - intermediate
        - advanced
        example: advanced
        type: string
      minutes:
        description: |-
          Minutes is the course's advertised length, which is more than the sum of
          its lessons: it includes time spent in the simulations.
        example: 198
        type: integer
      title:
        example: Replication & consensus
        type: string
    type: object
  schemas.DomainSchema:
    properties:
      id:
        example: dist
        type: string
      name:
        example: Distributed systems
        type: string
    type: object
  schemas.HealthSchema:
    properties:
      status:
        example: ok
        type: string
    type: object
  schemas.LessonSchema:
    properties:
      code:
        description: |-
          Code is the lesson's place in the syllabus: 2.3 is the third lesson of
          the second module.
        example: "2.3"
        type: string
      minutes:
        example: 15
        type: integer
      steps:
        example:
        - watch
        - read
        - range
        - bet
        items:
          enum:
          - watch
          - read
          - build
          - trace
          - range
          - bet
          - break
          - postmortem
          type: string
        type: array
      title:
        example: Sizing replicated storage
        type: string
    type: object
  schemas.ModuleSchema:
    properties:
      lessonCount:
        example: 4
        type: integer
      lessons:
        description: |-
          Lessons is null when the course keeps its syllabus private from visitors
          who are not signed in.
        items:
          $ref: '#/definitions/schemas.LessonSchema'
        type: array
      title:
        example: Quorums
        type: string
    type: object
  schemas.ReadinessSchema:
    properties:
      database:
        example: ok
        type: string
      error:
        type: string
      status:
        example: ok
        type: string
    type: object
  schemas.UserProfileSchema:
    properties:
      email:
        example: john@example.com
        type: string
      externalProvider:
        description: |-
          ExternalProvider is the federated identity the user signed in through, and
          is null for a user who signed up with a password.
        example: Google
        type: string
      name:
        example: John Doe
        type: string
      picture:
        example: https://example.com/picture.png
        type: string
    type: object
  schemas.UserSchema:
    properties:
      id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      profile:
        allOf:
        - $ref: '#/definitions/schemas.UserProfileSchema'
        description: |-
          Profile is filled in by the /me endpoint, which caches the call to the user
          pool that fills it, and left out of the plain reads of the local record.
    type: object
info:
  contact: {}
  description: Learning platform API for users, courses and progress
  title: SteadyLearn API
  version: "1.0"
paths:
  /health:
    get:
      description: Reports that the process is serving requests. Checks no dependencies.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.HealthSchema'
      summary: Health check
      tags:
      - health
  /health/live:
    get:
      description: Reports that the process is alive. Always 200 while the server
        is up, so a failure means the process should be restarted.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.HealthSchema'
      summary: Liveness probe
      tags:
      - health
  /health/ready:
    get:
      description: Reports whether the service can serve traffic, verifying the database
        connection. Returns 503 when it is unavailable.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.ReadinessSchema'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/schemas.ReadinessSchema'
      summary: Readiness probe
      tags:
      - health
  /v1/catalog:
    get:
      description: Every published course with the domains they belong to, in display
        order. Public, and the same for every caller. Served from a cache for up to
        ten minutes.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.CatalogSchema'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get the catalog
      tags:
      - catalog
  /v1/courses/{id}:
    get:
      description: 'A published course with its syllabus, as a visitor who is not
        signed in sees it: a course that keeps its syllabus private lists each module''s
        lesson count, and null for its lessons. Served from a cache for up to ten
        minutes.'
      parameters:
      - description: Course slug
        example: replication-consensus
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.CourseSchema'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a course
      tags:
      - catalog
  /v1/users:
    post:
      consumes:
      - application/json
      description: Create the local record for the authenticated Cognito user. Idempotent.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.UserSchema'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Setup user
      tags:
      - users
  /v1/users/me:
    get:
      consumes:
      - application/json
      description: Get the currently authenticated user with the identity provider's
        profile attached. Served from a cache for up to five minutes, so a change
        made in the user pool can take that long to show. A 404 means the user has
        not been set up yet.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.UserSchema'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - users
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 'Enter your Bearer token in the format: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
