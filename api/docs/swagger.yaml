basePath: /
definitions:
  schemas.HealthSchema:
    properties:
      status:
        example: ok
        type: string
    type: object
  schemas.ReadinessSchema:
    properties:
      database:
        example: ok
        type: string
      error:
        type: string
      status:
        example: ok
        type: string
    type: object
  schemas.UserProfileSchema:
    properties:
      email:
        example: john@example.com
        type: string
      externalProvider:
        description: |-
          ExternalProvider is the federated identity the user signed in through, and
          is null for a user who signed up with a password.
        example: Google
        type: string
      name:
        example: John Doe
        type: string
      picture:
        example: https://example.com/picture.png
        type: string
    type: object
  schemas.UserSchema:
    properties:
      id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      profile:
        allOf:
        - $ref: '#/definitions/schemas.UserProfileSchema'
        description: |-
          Profile is filled in only when the request asks for it, because filling it
          in costs a call to the user pool.
    type: object
info:
  contact: {}
  description: Learning platform API for users, courses and progress
  title: SteadyLearn API
  version: "1.0"
paths:
  /health:
    get:
      description: Reports that the process is serving requests. Checks no dependencies.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.HealthSchema'
      summary: Health check
      tags:
      - health
  /health/live:
    get:
      description: Reports that the process is alive. Always 200 while the server
        is up, so a failure means the process should be restarted.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.HealthSchema'
      summary: Liveness probe
      tags:
      - health
  /health/ready:
    get:
      description: Reports whether the service can serve traffic, verifying the database
        connection. Returns 503 when it is unavailable.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.ReadinessSchema'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/schemas.ReadinessSchema'
      summary: Readiness probe
      tags:
      - health
  /v1/users:
    post:
      consumes:
      - application/json
      description: Create the local record for the authenticated Cognito user. Idempotent.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.UserSchema'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Setup user
      tags:
      - users
  /v1/users/me:
    get:
      consumes:
      - application/json
      description: Get the currently authenticated user, optionally with the identity
        provider's profile attached. A 404 means the user has not been set up yet.
      parameters:
      - description: Attach the identity provider's profile block. Costs one call
          to the user pool
        in: query
        name: profile
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/schemas.UserSchema'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - users
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 'Enter your Bearer token in the format: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
