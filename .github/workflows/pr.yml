name: pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Scope comes first: a PR that changes more than one area fails there, and
# every other job is skipped with it. The same job then reports which areas
# changed, and each check below runs only for its own. Skipped jobs start no
# runner, but a skipped job also counts as passing a required check, so the
# one check to require is PR Checks at the end.
jobs:
  scope:
    name: PR Scope
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.diff.outputs.workflows }}
      api: ${{ steps.diff.outputs.api }}
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/check-scope

      - id: diff
        uses: ./.github/actions/detect-changes

  go-lint:
    name: Go Linter
    needs: scope
    if: needs.scope.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/go-lint

  go-test:
    name: API Tests
    needs: scope
    if: needs.scope.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/go-test

  migrations:
    name: Atlas Migrations
    needs: scope
    if: needs.scope.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/atlas-migrations

  app-lint:
    name: App Linter
    needs: scope
    if: needs.scope.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/app-lint

  # The images are built, not pushed: nothing deploys a PR build. A change to
  # .github/ builds both, since a workflow edit can break either build.
  build-api:
    name: Build API
    needs: scope
    if: needs.scope.outputs.api == 'true' || needs.scope.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/build-image
        with:
          context: api

  build-app:
    name: Build App
    needs: scope
    if: needs.scope.outputs.app == 'true' || needs.scope.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/build-image
        with:
          context: app

  # always(), not !cancelled(): a skipped gate would pass the required check,
  # so a cancelled run has to fail here instead.
  checks:
    name: PR Checks
    needs: [scope, go-lint, go-test, migrations, app-lint, build-api, build-app]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if [ "$(echo "$NEEDS" | jq -r '.scope.result')" != success ]; then
            echo "::error::PR Scope did not succeed"
            exit 1
          fi
          failed=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key' | xargs)
          if [ -n "$failed" ]; then
            echo "::error::Did not succeed: ${failed// /, }"
            exit 1
          fi
