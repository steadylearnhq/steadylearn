name: Build image
description: Build the Docker image of api/ or app/, and push it to GHCR when asked.

# Needs the repository checked out. Both modes read the layer cache the pushes
# write, one scope per directory. A build that does not push does not write
# the cache either, which would only evict the pushed builds' from the shared
# cache quota.

inputs:
  context:
    description: "The directory to build: api or app"
    required: true
  push:
    description: "'true' to push the image to GHCR; otherwise it is only built"
    default: "false"
  image:
    description: The full image reference to tag and push, e.g. ghcr.io/owner/name:sha. Required when pushing.
    default: ""
  registry-token:
    description: A token that can write packages, usually secrets.GITHUB_TOKEN. Required when pushing.
    default: ""

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4

    - if: inputs.push == 'true'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.registry-token }}

    # No build args: the app's VITE_ values are placeholders that
    # docker/50-inject-env.sh replaces at container start, from the service's
    # own environment.
    - uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        platforms: linux/amd64
        push: ${{ inputs.push == 'true' }}
        outputs: ${{ inputs.push != 'true' && 'type=cacheonly' || '' }}
        tags: ${{ inputs.image }}
        labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        cache-from: type=gha,scope=${{ inputs.context }}
        cache-to: ${{ inputs.push == 'true' && format('type=gha,scope={0},mode=max', inputs.context) || '' }}
